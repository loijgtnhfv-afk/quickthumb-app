name: Refresh style descriptors from trending YouTube thumbs (RETIRED)

# RETIRED 2026-07-27 — schedule removed, kept runnable by hand only.
#
# This job fed references/descriptors.json, which was read by the Flux + Satori
# pipeline's descriptorClauseFor(). That pipeline was replaced by Nano Banana
# Pro on 2026-06-03 and the consumer went with it, so for ~8 weeks this ran
# every Monday, spent a YouTube quota and a Claude Vision call, committed a
# file, and changed nothing about the product.
#
# Its replacement is learn-from-gallery.yml, whose output IS read on every
# generation (lib/gallery-insights.ts -> app/api/generate/route.ts).
#
# Left in place rather than deleted because the collect/extract scripts are
# still useful for one-off reference work; run it from the Actions tab if you
# ever want descriptors.json refreshed again.

on:
  workflow_dispatch:

# We push the updated descriptors.json back to the repo, so the workflow
# needs write access to contents.
permissions:
  contents: write

# Only one refresh at a time — overlapping runs race on the git push and
# produce duplicate "refresh descriptors" commits.
concurrency:
  group: refresh-descriptors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci || npm install

      - name: Collect trending thumbs (JP + US)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run collect-trending

      - name: Extract style descriptors via Claude Vision
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run extract-descriptors

      - name: Commit descriptors.json if changed
        run: |
          git config user.name "quickthumb-bot"
          git config user.email "quickthumb-bot@users.noreply.github.com"
          # Only descriptors.json is tracked — trending image files are
          # gitignored, so they won't pollute the commit even though they
          # live in the workspace after collect-trending ran.
          if git diff --quiet -- references/descriptors.json; then
            echo "No descriptor changes — nothing to commit."
            exit 0
          fi
          git add references/descriptors.json
          git commit -m "chore: refresh style descriptors from this week's trending thumbs"
          git push
